[build]
  command = "node scripts/prepare-deployment.mjs"
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Short links for the Instagram comment / bio launch.
[[redirects]]
  from = "/try"
  to = "/idea.html"
  status = 200

[[redirects]]
  from = "/beta"
  to = "/join.html"
  status = 200

[[redirects]]
  from = "/impact"
  to = "/impact.html"
  status = 200

# Independent public assistance directory (no account, no uploads).
[[redirects]]
  from = "/help"
  to = "/resources.html"
  status = 200

[[redirects]]
  from = "/resources"
  to = "/resources.html"
  status = 200
